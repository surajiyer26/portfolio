<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>surajiyer.xyz ~ terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { mono: ['"Fira Code"', 'monospace'] },
                    colors: {
                        void: '#030712',
                        termAccent: 'var(--accent, #10b981)',
                        termSecondary: 'var(--secondary, #06b6d4)',
                    }
                }
            }
        }
    </script>
    <style>
        :root { --accent: #10b981; --secondary: #06b6d4; }
        
        /* CRT Scanline Effect */
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 40;
            pointer-events: none;
            opacity: 0.4;
        }
    </style>
</head>
<body class="crt bg-void text-zinc-300 font-mono min-h-screen p-3 md:p-8 flex items-center justify-center selection:bg-emerald-500 selection:text-black">

    <!-- Terminal Window Container (Fixed Height Shell) -->
    <div class="w-full max-w-4xl bg-zinc-950/90 border border-zinc-800/80 rounded-xl shadow-2xl backdrop-blur-md overflow-hidden flex flex-col h-[85vh]">
        
        <!-- Window Topbar -->
        <div class="shrink-0 bg-zinc-900/90 px-4 py-3 border-b border-zinc-800/80 flex items-center justify-between select-none">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-red-500/80 hover:bg-red-500 cursor-pointer"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500/80 hover:bg-yellow-500 cursor-pointer"></div>
                <div class="w-3 h-3 rounded-full bg-green-500/80 hover:bg-green-500 cursor-pointer"></div>
                <span class="ml-2 text-xs text-zinc-500 font-medium">~ (zsh)</span>
            </div>
            <div class="text-[11px] text-zinc-500 hidden sm:block">
                <span>UTF-8</span> | <span id="clock">00:00:00</span>
            </div>
        </div>

        <!-- Terminal Body -->
        <div class="p-4 md:p-6 flex-1 flex flex-col min-h-0 overflow-hidden space-y-3">
            
            <!-- Output Buffer (Scrolls internally while keeping controls docked) -->
            <div id="terminal-output" class="flex-1 overflow-y-auto space-y-4 text-xs md:text-sm pr-2 scrollbar-thin scrollbar-thumb-zinc-800">
                <!-- Banner loaded dynamically -->
            </div>

            <!-- Sticky Command Quick-Action Pills -->
            <div class="shrink-0 flex flex-wrap gap-1.5 pt-2 border-t border-zinc-900/80 bg-zinc-950/90">
                <button onclick="execCmd('summary')" class="px-2.5 py-1 bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-800 rounded text-[11px] text-zinc-300 transition hover:text-termAccent">summary</button>
                <button onclick="execCmd('exp')" class="px-2.5 py-1 bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-800 rounded text-[11px] text-zinc-300 transition hover:text-termAccent">exp</button>
                <button onclick="execCmd('projects')" class="px-2.5 py-1 bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-800 rounded text-[11px] text-zinc-300 transition hover:text-termAccent">projects</button>
                <button onclick="execCmd('skills')" class="px-2.5 py-1 bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-800 rounded text-[11px] text-zinc-300 transition hover:text-termAccent">skills</button>
                <button onclick="execCmd('contact')" class="px-2.5 py-1 bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-800 rounded text-[11px] text-zinc-300 transition hover:text-termAccent">contact</button>
                <button onclick="execCmd('clear')" class="px-2.5 py-1 bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-800 rounded text-[11px] text-red-400 hover:border-red-500/50 transition">clear</button>
            </div>

            <!-- Command Input Prompt (Anchored at bottom) -->
            <div class="shrink-0 flex items-center space-x-2 bg-zinc-900/40 px-3 py-2 rounded-lg border border-zinc-800/80 focus-within:border-zinc-700">
                <span class="text-termAccent font-bold text-xs select-none">⚡ suraj@dev:~$</span>
                <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false" class="bg-transparent border-none outline-none flex-1 text-zinc-100 text-xs md:text-sm font-mono caret-termAccent" placeholder="type command (e.g. 'help', 'exp')...">
            </div>
        </div>
    </div>

    <script>
        // Clock Display
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        const output = document.getElementById('terminal-output');
        const input = document.getElementById('cmd-input');
        let history = [];
        let historyIdx = -1;

        // Pixel-perfect 60-character symmetric SURAJ IYER ASCII banner
        const initialBannerHTML = String.raw`
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 pb-4 border-b border-zinc-900">
                <pre class="md:col-span-6 text-termAccent font-bold leading-none text-[7px] sm:text-[8px] md:text-[9px] lg:text-[10px] select-none overflow-x-auto">

 ___   _   _   ___     _      _     ___  __   __  ___   ___ 
/ __| | | | | | _ \   /_\    | |   |_ _| \ \ / / | __| | _ \
\__ \ | |_| | |   /  / _ \  _| |    | |   \ V /  | _|  |   /
|___/  \___/  |_|_\ /_/ \_\|___|   |___|   |_|   |___| |_|_\
                </pre>
                <div class="md:col-span-6 space-y-1 text-xs">
                    <p><span class="text-termAccent font-semibold">OS:</span> macOS / Arch Linux x86_64</p>
                    <p><span class="text-termAccent font-semibold">Role:</span> Software Engineer @ Branch International</p>
                    <p><span class="text-termAccent font-semibold">Focus:</span> Backend & Cloud Infrastructure</p>
                    <p><span class="text-termAccent font-semibold">CP:</span> Expert at Codeforces and 5-star at CodeChef</p>
                    <p><span class="text-termAccent font-semibold">Shell:</span> zsh 5.9 (x86_64-apple-darwin22.0)</p>
                </div>
            </div>
            <div class="text-zinc-400 text-xs">
                Type <span class="text-termAccent font-bold">help</span> to view available shell commands or click quick-action pills below.
            </div>
        `;

        // Render Initial Banner on Page Load
        output.innerHTML = initialBannerHTML;

        const commands = {
            help: `
                <div class="space-y-1 text-zinc-400">
                    <p class="text-zinc-200 font-bold">AVAILABLE COMMANDS:</p>
                    <p><span class="text-termAccent font-semibold">summary</span>    - System overview & personal stats</p>
                    <p><span class="text-termAccent font-semibold">about</span>      - Personal background & profile</p>
                    <p><span class="text-termAccent font-semibold">exp</span>        - Work experience & internships</p>
                    <p><span class="text-termAccent font-semibold">projects</span>   - Key infrastructure & backend projects</p>
                    <p><span class="text-termAccent font-semibold">skills</span>     - Programming languages, cloud tools & ratings</p>
                    <p><span class="text-termAccent font-semibold">sudo</span>       - Request root privileges</p>
                    <p><span class="text-termAccent font-semibold">contact</span>    - Social links & email</p>
                    <p><span class="text-termAccent font-semibold">clear</span>      - Reset terminal screen</p>
                </div>
            `,
            about: `
                <div class="space-y-2 text-zinc-300">
                    <p>⚡ <span class="text-zinc-100 font-bold">Suraj Iyer</span> | Software Engineer @ Branch International</p>
                    <p class="text-zinc-400">Specializing in high-concurrency backend systems, Go microservices, Kubernetes, and IaC automation.</p>
                    <p class="text-zinc-400">Completed B.Tech in Computer Engineering at Sardar Patel Institute of Technology with Minors in Finance & Management from SPJIMR.</p>
                </div>
            `,
            exp: `
                <div class="space-y-3 text-zinc-300">
                    <div class="border-l-2 border-termAccent pl-3">
                        <p class="text-zinc-100 font-bold">Software Engineer @ Branch International</p>
                        <p class="text-zinc-500 text-xs">Jul 2025 – Present | Remote</p>
                        <p class="text-xs text-zinc-400 mt-1">• Reduced server P95 response times by 80% using a Go reverse proxy with long polling and Redis Pub/Sub.</p>
                        <p class="text-xs text-zinc-400">• Provisioned cloud resources with Terraform CDK and Pulumi; deployed org-wide SAST/DAST automation in CI/CD.</p>
                    </div>
                    <div class="border-l-2 border-zinc-800 pl-3">
                        <p class="text-zinc-100 font-bold">Software Engineer Intern @ Branch International</p>
                        <p class="text-zinc-500 text-xs">Jan 2025 – Jun 2025</p>
                        <p class="text-xs text-zinc-400 mt-1">• Optimized infrastructure log and metric monitoring, cutting Datadog monthly bill by $10,000.</p>
                        <p class="text-xs text-zinc-400">• Built on-demand UAT testing environments for Kubernetes services using Helm charts.</p>
                    </div>
                    <div class="border-l-2 border-zinc-800 pl-3">
                        <p class="text-zinc-100 font-bold">Software Engineer Intern @ Barclays</p>
                        <p class="text-zinc-500 text-xs">Jun 2024 – Aug 2024 | Pune, India</p>
                        <p class="text-xs text-zinc-400 mt-1">• Automated QA report generation into scheduled emails using Python, SQL, and HTML parsing via TeamCity.</p>
                        <p class="text-xs text-zinc-400">• Upgraded core enterprise Spring Maven repository from Java 1.8 to Java 11.</p>
                    </div>
                </div>
            `,
            projects: `
                <div class="space-y-3">
                    <div class="bg-zinc-900/50 p-3 rounded border border-zinc-800/80">
                        <p class="text-termSecondary font-bold">🚀 Self-Hosted CI/CD Platform (Jul 2026)</p>
                        <p class="text-xs text-zinc-400 mt-1">Migrated SaaS CI pipelines to ephemeral Kubernetes runners with Karpenter node autoscaling on AWS EKS, reducing spending by $6.5k/month across 300 concurrent jobs. Automated deployments using Argo CD and GitOps.</p>
                        <p class="text-xs text-zinc-500 mt-1">Tech Stack: Kubernetes, Karpenter, Argo CD, BuildKit, AWS, GitHub Actions</p>
                    </div>
                </div>
            `,
            skills: `
                <div class="space-y-2 text-zinc-300">
                    <p><span class="text-termAccent font-bold">Languages:</span> Go, Python, Ruby, TypeScript, C/C++, SQL, Bash</p>
                    <p><span class="text-termAccent font-bold">Cloud & DevOps:</span> AWS, GCP, Kubernetes, Docker, GitHub Actions, Argo CD, Terraform, Pulumi, Helm, Datadog</p>
                    <p><span class="text-termAccent font-bold">Databases & Messaging:</span> Redis, PostgreSQL, RabbitMQ</p>
                    <p><span class="text-termAccent font-bold">Competitive Programming:</span> Expert at Codeforces and 5-star at CodeChef, ICPC Asia Regional Rank 138</p>
                </div>
            `,
            contact: `
                <div class="space-y-1.5 text-zinc-300">
                    <p>📧 Email: <a href="mailto:iyersuraj7@gmail.com" class="text-termSecondary underline">iyersuraj7@gmail.com</a></p>
                    <p>💼 LinkedIn: <a href="https://www.linkedin.com/in/surajiyer26/" target="_blank" class="text-termSecondary underline">linkedin.com/in/surajiyer26</a></p>
                    <p>🐙 GitHub: <a href="https://github.com/surajiyer26" target="_blank" class="text-termSecondary underline">github.com/surajiyer26</a></p>
                </div>
            `,
            sudo: `<p class="text-red-400 font-bold">Nice try! suraj is not in the sudoers file. This incident will be reported.</p>`
        };

        function execCmd(rawCmd) {
            const cmd = rawCmd.trim().toLowerCase();
            if (!cmd) return;

            history.push(rawCmd);
            historyIdx = history.length;

            if (cmd === 'clear') {
                output.innerHTML = initialBannerHTML;
                return;
            }

            const line = document.createElement('div');
            line.className = "flex space-x-2 text-xs";
            line.innerHTML = `<span class="text-termAccent font-bold">⚡ suraj@dev:~$</span> <span class="text-zinc-100">${rawCmd}</span>`;
            output.appendChild(line);

            const res = document.createElement('div');
            res.className = "text-xs md:text-sm pl-2";

            if (cmd === 'summary' || cmd === 'neofetch') {
                res.innerHTML = commands.about + commands.skills;
            } else if (commands[cmd]) {
                res.innerHTML = commands[cmd];
            } else {
                res.innerHTML = `<p class="text-red-400">zsh: command not found: ${cmd}. Type <span class="text-termAccent font-bold">help</span> for available commands.</p>`;
            }

            output.appendChild(res);
            output.scrollTop = output.scrollHeight;
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                execCmd(input.value);
                input.value = '';
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIdx > 0) {
                    historyIdx--;
                    input.value = history[historyIdx];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIdx < history.length - 1) {
                    historyIdx++;
                    input.value = history[historyIdx];
                } else {
                    historyIdx = history.length;
                    input.value = '';
                }
            } else if (e.key === 'Tab') {
                e.preventDefault();
                const val = input.value.trim().toLowerCase();
                const matches = Object.keys(commands).filter(c => c.startsWith(val));
                if (matches.length === 1) {
                    input.value = matches[0];
                }
            }
        });
    </script>
</body>
</html>
